# Render Blueprint: one free Docker web service (API + web UI in one container).
services:
  - type: web
    name: verifai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEY
        sync: false  # entered in the Render dashboard, never committed
      - key: REFUSAL_THRESHOLD
        value: "0.72"
